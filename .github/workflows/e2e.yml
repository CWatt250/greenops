name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      CI: 'true'
      # Local Supabase fixtures — standard demo keys, only valid against
      # 127.0.0.1:54321 (not secrets).
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      # Optional integrations (set as repo Actions secrets). Defaults keep the
      # suite green: measure full-flow skips, routes surfaces a backend error.
      NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.E2E_MAPBOX_TOKEN || 'pk.placeholder' }}
      ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
      # E2E user credentials (provisioned into local Supabase at runtime).
      E2E_OWNER_EMAIL: e2e-owner@tlc.com
      E2E_OWNER_PASSWORD: e2e-Owner-Pass-123!
      E2E_CREW_EMAIL: e2e-crew@tlc.com
      E2E_CREW_PASSWORD: e2e-Crew-Pass-123!
      E2E_COMPANY_ID: b2ddca19-8f06-4884-a1ca-9b3be5df8ecb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium + system deps)
        run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase + apply migrations
        run: supabase start

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
